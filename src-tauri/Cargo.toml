[package]
name = "dbm"
version = "0.1.0"
description = "A lightweight MySQL desktop workbench"
edition = "2021"

[lib]
name = "dbm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
csv = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
